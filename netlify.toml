[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # 22, not 20: supabase-js's realtime client (initialized even though we
  # never use realtime) requires a native WebSocket global to construct
  # without crashing. Node 20 doesn't have one by default; Node 22 does.
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# CLAUDE.md specifies the AI endpoint as `/ai`. This rewrite must stay ABOVE
# the SPA catch-all below — redirects are evaluated in order, so without it
# `/ai` would be swallowed by `/*` and served index.html.
[[redirects]]
  from = "/ai"
  to = "/.netlify/functions/ai"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
